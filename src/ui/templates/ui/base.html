
{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Magic Experiences Perú{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'ui/css/base.css' %}">
</head>
<body>
    <div class="aplicacion">
        <aside class="menu-lateral">
            <div class="marca">
                <a href="/inicio/" class="enlace-logo" aria-label="Ir al inicio">
                    <img
                        src="{% static 'ui/img/logo-montana.png' %}"
                        alt="Magic Experiences Perú"
                        class="logo-menu"
                    >
                </a>
            </div>

            <nav class="navegacion" aria-label="Menú principal">
                <a href="/inicio/"
                class="enlace-menu {% if request.path == '/inicio/' %}activo{% endif %}">
                    Inicio
                </a>

                <a href="/reservas/"
                class="enlace-menu {% if request.path|slice:':10' == '/reservas/' %}activo{% endif %}">
                    Reservas
                </a>

                <a href="/itinerarios/"
                class="enlace-menu {% if request.path|slice:':13' == '/itinerarios/' %}activo{% endif %}">
                    Itinerarios
                </a>

                <a href="/clientes/"
                class="enlace-menu {% if request.path|slice:':10' == '/clientes/' %}activo{% endif %}">
                    Clientes
                </a>

                <a href="/reportes/"
                class="enlace-menu {% if request.path|slice:':10' == '/reportes/' %}activo{% endif %}">
                    Reportes
                </a>
            </nav>

        </aside>

        <div class="area-principal">
            <header class="encabezado">
                <div class="usuario-superior">
                    <span class="usuario-avatar">R</span>

                    <div class="usuario-informacion">
                        <strong>Reservas</strong>
                        <small>Área de reservas</small>
                    </div>
                </div>

                <a href="/login/" class="boton-salir" id="boton-salir">
                    Salir
                </a>
            </header>

            <main class="contenido{% if request.path == '/inicio/' or request.path == '/clientes/' or request.path == '/reportes/' %} fondo-machu-picchu{% endif %}">
                {% block contenido %}
                {% endblock %}
            </main>
        </div>
    </div>
    <script src="{% static 'ui/js/sesion_demo.js' %}" defer></script>
</body>
</html>
